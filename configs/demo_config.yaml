environment:
  n_uavs: 5
  world_size: [24.0, 24.0, 24.0]
  min_space_size: 1.0   # 仅用于未配置 margin_size 时计算 margin_size = min_space_size/2
  max_space_size: 5.0
  # margin_size 不写则代码中取 min_space_size/2；实际可分配 min = 4*margin_size
  priority_range: [0.1, 1.0]
  urgency_range: [0.0, 1.0]

algorithm:
  name: "MAPPO"
  actor_lr: 0.0003
  critic_lr: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  ppo_epochs: 10
  batch_size: 64
  hidden_dim: 64

training:
  n_episodes: 500       # Demo 规模，可按需增大
  max_steps: 100
  update_freq: 50        # 每采集 100 个 episode 更新一次
  save_freq: 50
  save_dir: "checkpoints"

safety:
  buffer: 0.1

# 可插拔导航：不配置或 type 为空则随机移动；接入后空间分配不干预导航
navigation:
  type: "astar"
  grid_resolution: 1.0
  step_size: 2.5

reward_weights:
  task_weight: 1.0
  completion_bonus: 1.0
  safety_weight: 0
  efficiency_weight: 0

# 任务池 + 规则调度（激活即在任务起点 spawn）。enabled: false 则恢复传统每局固定起点终点。
task_scheduler:
  enabled: true
  initial_tasks: 4            # episode 开局一次性注入任务数（用于初始激活更多 UAV）
  arrival_every_n_steps: 25   # 每多少环境步到达一批任务
  tasks_per_arrival: 2
  margin: 2.0
  min_seg_len: 3.0
  # deadline_steps: 200        # 可选：任务进入池后的剩余步数，超时标记 expired


